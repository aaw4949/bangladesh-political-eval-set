name: Validate evaluation set

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      - name: Validate research integration
        run: python scripts/validate_research.py

      - name: Check Python syntax
        run: python -m py_compile prompts.py scripts/*.py tests/*.py

      - name: Test evaluator prompts
        run: python -m unittest discover -s tests -v
